[Config]
; GLDirect Configuration File
; GLDirect is an opengl32.dll wrapper whose normal backend translates GL to D3D9.

; Direct-backend selection (used when dwUseMesa=0):
; 0 = Mesa Software Renderer (CPU-only, slow) - NOT RECOMMENDED
; 1 = Direct3D Software Renderer (software D3D, slow) - NOT RECOMMENDED
; 2 = Direct3D Hardware Renderer (legacy DX9 + Mesa state machine) - BROKEN on modern systems
; 3 = modern direct GL-to-D3D9 translator
dwDriver=3

; Mesa llvmpipe diagnostic renderer (1 = explicit opt-in)
;
; Off, this wrapper uses the direct GL-to-D3D9 graphics path, so the D3D9 stream
; carries real geometry, transforms and texture stage state. That is
; what tools like RTX Remix reconstruct a scene from, and it runs on the GPU.
;
; On, mesa_gl.dll executes modern GL in software and the finished image is
; presented through D3D9 as one fullscreen quad. A requested core context
; exposes OpenGL 4.6/GLSL 4.60; legacy compatibility contexts expose 4.5.
; This is the correctness backend, but Remix sees a
; picture instead of a scene, and software rasterization at modern
; resolutions is slow enough to be measured in seconds per frame.
;
; Keep this at 0 for direct GL-to-D3D9 translation and real D3D9 geometry.
; mesa_gl.dll is also used by the direct backend's private compute-only worker;
; that worker never owns the public context and never renders or presents.
dwUseMesa=0

; Enable hardware acceleration features
bMipmapping=1
bMultitexture=1
bWaitForRetrace=0
bFullscreenBlit=0
bFastFPU=1
bPersistantDisplay=0
bPersistantResources=0

; Logging settings
dwLogging=1
dwLoggingSeverity=1
LogVerbosity=info
bMessageBoxWarnings=0

; Threading and compatibility
bMultiThreaded=0
bAppCustomizations=1
bHotKeySupport=0
bSplashScreen=0

; Direct3D 9 settings
dwAdapter=0
dwTnL=0
dwMultisample=0
